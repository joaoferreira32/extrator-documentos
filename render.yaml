services:
  - type: web
    name: extrator-docs
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ANTHROPIC_API_KEY
        sync: false
      # O limite por IP (app/rate_limit.py) usa o X-Forwarded-For no Render por padrao
      # (detecta RENDER=true); nao precisa de variavel aqui.
